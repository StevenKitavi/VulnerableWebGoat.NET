---
- name: Hardening GPO - LLMNR/NBT-NS, SMB Signing, IPv6, LDAP
  hosts: domain_controllers
  gather_facts: false
  vars:
    gpo_name: "Harden-Network-LDAP-Security"
    gpo_comment: "Disables LLMNR/NBT-NS, requires SMB signing, prefers IPv4, enforces LDAP signing/channel binding, restricts anonymous enumeration"
    # Change this. Prefer linking client settings to Workstations/Servers OU
    # and DC-specific settings to Domain Controllers OU
    target_dn: "DC=example,DC=com"

  tasks:
    - name: Import GroupPolicy module
      ansible.windows.win_powershell:
        script: |
          if (-not (Get-Module -ListAvailable -Name GroupPolicy)) {
            throw "GroupPolicy module not available"
          }
          Import-Module GroupPolicy -ErrorAction Stop

    - name: Create GPO if missing
      ansible.windows.win_powershell:
        script: |
          $name = "{{ gpo_name }}"
          if (-not (Get-GPO -Name $name -ErrorAction SilentlyContinue)) {
            New-GPO -Name $name -Comment "{{ gpo_comment }}" | Out-Null
            Write-Output "Created GPO: $name"
          }

    # ---------- LLMNR, NBT-NS, SMB ----------
    - name: Disable LLMNR
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient" `
            -ValueName "EnableMulticast" -Type DWord -Value 0

    - name: Disable NBT-NS name resolution
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters" `
            -ValueName "EnableNetbios" -Type DWord -Value 0

    - name: Require SMB signing (client)
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters" `
            -ValueName "RequireSecuritySignature" -Type DWord -Value 1

    - name: Require SMB signing (server)
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" `
            -ValueName "RequireSecuritySignature" -Type DWord -Value 1

    # ---------- IPv6 ----------
    - name: Prefer IPv4 over IPv6 (recommended instead of full disable)
      ansible.windows.win_powershell:
        script: |
          # 32 (0x20) = Prefer IPv4 over IPv6
          # Use 255 (0xFF) only if you really want to disable IPv6 completely (not recommended)
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters" `
            -ValueName "DisabledComponents" -Type DWord -Value 32
          Write-Output "IPv4 preferred over IPv6 (DisabledComponents=32)"

    # ---------- LDAP Client Signing ----------
    - name: Require LDAP client signing
      ansible.windows.win_powershell:
        script: |
          # 2 = Require signing, 1 = Negotiate signing
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\LDAP" `
            -ValueName "LDAPClientIntegrity" -Type DWord -Value 2
          Write-Output "LDAP client signing required"

    # ---------- LDAP Server Signing + Channel Binding (primarily for DCs) ----------
    - name: Require LDAP server signing (DCs)
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters" `
            -ValueName "LDAPServerIntegrity" -Type DWord -Value 2
          Write-Output "LDAP server signing required (LDAPServerIntegrity=2)"

    - name: Enforce LDAP channel binding (Always)
      ansible.windows.win_powershell:
        script: |
          # 0 = Never, 1 = When supported, 2 = Always
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters" `
            -ValueName "LdapEnforceChannelBinding" -Type DWord -Value 2
          Write-Output "LDAP channel binding enforced (Always)"

    # ---------- Anonymous enumeration restrictions ----------
    - name: Restrict anonymous enumeration of SAM and shares
      ansible.windows.win_powershell:
        script: |
          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" `
            -ValueName "RestrictAnonymous" -Type DWord -Value 1

          Set-GPRegistryValue -Name "{{ gpo_name }}" `
            -Key "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" `
            -ValueName "RestrictAnonymousSAM" -Type DWord -Value 1

          Write-Output "Anonymous SAM/share enumeration restricted"

    # ---------- Link GPO ----------
    - name: Link GPO to target
      ansible.windows.win_powershell:
        script: |
          $links = Get-GPInheritance -Target "{{ target_dn }}" -ErrorAction SilentlyContinue
          $already = $links.GpoLinks | Where-Object { $_.DisplayName -eq "{{ gpo_name }}" }
          if (-not $already) {
            New-GPLink -Name "{{ gpo_name }}" -Target "{{ target_dn }}" -LinkEnabled Yes | Out-Null
            Write-Output "GPO linked"
          }

    - name: Summary of settings
      ansible.windows.win_powershell:
        script: |
          Get-GPRegistryValue -Name "{{ gpo_name }}" -ErrorAction SilentlyContinue |
            Select-Object Key, ValueName, Value, Type |
            Format-Table -AutoSize | Out-String