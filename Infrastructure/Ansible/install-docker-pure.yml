---
# install-docker-pure.yml
# Installs a clean, default Docker CE environment (not CIS compliant)
- name: Install pure (non-CIS) Docker environment
  hosts: all
  become: true
  gather_facts: true

  vars:
    docker_users: []
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Fail if unsupported OS family
      ansible.builtin.fail:
        msg: "Supported OS families: Debian, RedHat"
      when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

    # ---------- Debian / Ubuntu ----------
    - name: Debian/Ubuntu - Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Debian/Ubuntu - Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Debian/Ubuntu - Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: ansible_facts['os_family'] == 'Debian'

    - name: Debian/Ubuntu - Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
          {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker
      when: ansible_facts['os_family'] == 'Debian'

    - name: Debian/Ubuntu - Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    # ---------- RHEL family ----------
    - name: RedHat - Install prerequisites
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - yum-utils
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: RedHat - Remove conflicting packages
      ansible.builtin.dnf:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-engine
          - podman
          - runc
        state: absent
      when: ansible_facts['os_family'] == 'RedHat'
      ignore_errors: true

    - name: RedHat - Add Docker repository
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ 'rhel' if ansible_facts['distribution'] == 'RedHat' else ansible_facts['distribution'] | lower }}/docker-ce.repo"
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: RedHat - Install Docker packages
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    # ---------- Common ----------
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Normalize docker_users to a list
      ansible.builtin.set_fact:
        docker_users_list: >-
          {{
            docker_users
            if (docker_users is sequence and docker_users is not string)
            else ([docker_users] if docker_users | default('') | length > 0 else [])
          }}

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users_list }}"
      when: docker_users_list | length > 0

    - name: Ensure /etc/docker directory exists (default empty config)
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker is running
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false
      failed_when: docker_info.rc != 0

    - name: Display Docker version
      ansible.builtin.command: docker version --format '{{.Server.Version}}'
      register: docker_ver
      changed_when: false

    - name: Success message
      ansible.builtin.debug:
        msg: "Pure Docker {{ docker_ver.stdout }} installed and running (not CIS hardened)."