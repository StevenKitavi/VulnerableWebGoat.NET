name: "CodeQL"

on:
  # Makes this workflow callable from other workflows (e.g. pipeline.yml)
  workflow_call:

  # Still allows it to run on its own if needed
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'          # Every Monday 06:00 UTC
  workflow_dispatch:              # Manual trigger

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      security-events: write      # Required to upload SARIF → Security tab
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # 1. Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      # 2. Build (creates the database)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # If Autobuild fails, replace the step above with this:
      # - name: Manual build
      #   run: |
      #     dotnet restore
      #     dotnet build --configuration Release --no-restore

      # 3. Analyze + Upload SARIF to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"