# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '16 15 * * 2'
  workflow_dispatch:          # Allows manual trigger from the Actions tab

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== C# (main language you are testing) =====
          - language: csharp
            build-mode: autobuild   # change to "manual" if autobuild fails

          # ===== Optional: keep only the languages you actually need =====
          # - language: javascript-typescript
          #   build-mode: none
          # - language: actions
          #   build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # or @v7 if you prefer the newest

      # Setup .NET (recommended for C#)
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3   # or @v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Optional: use a broader query suite
          # queries: security-and-quality
          # queries: security-extended

      # ---------------------------------------------------------------
      # Build step – only runs when build-mode is set to "manual"
      # ---------------------------------------------------------------
      - name: Manual build (C#)
        if: matrix.build-mode == 'manual' && matrix.language == 'csharp'
        shell: bash
        run: |
          echo "Running manual build for C#"
          dotnet restore
          dotnet build --configuration Release --no-restore

      # If you ever set other languages to "manual", add their build commands here

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3   # or @v4
        with:
          category: "/language:${{ matrix.language }}"
