name: Grype SCA

on:
  workflow_call:
    inputs:
      path:
        description: "Path to scan"
        required: false
        type: string
        default: "."
      severity-cutoff:
        description: "Severity cutoff for scan-action"
        required: false
        type: string
        default: "high"
      fail-threshold:
        description: "Fail if HIGH+CRITICAL count >= this (0 = never fail on count)"
        required: false
        type: number
        default: 5
      fail-build:
        description: "Unused kept for compatibility"
        required: false
        type: string
        default: "false"

  workflow_dispatch:

jobs:
  sca:
    name: Grype SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      # Fix: refresh DB (your error was "built 21 weeks ago")
      - name: Update Grype DB
        run: |
          grype db update
          grype db status

      - name: Run Grype (SARIF)
        continue-on-error: true
        run: |
          grype "dir:${{ inputs.path }}" \
            -o sarif \
            --file results.sarif \
            || true

          # Ensure file exists and is valid JSON object/array start
          if [ ! -s results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > results.sarif
          fi

      - name: Upload Grype SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: grype-sca

      - name: Grype table report
        if: always()
        run: |
          grype "dir:${{ inputs.path }}" -o table || true

      - name: Grype JSON + threshold check
        if: always()
        run: |
          grype "dir:${{ inputs.path }}" -o json --file grype-results.json || true

          if [ ! -s grype-results.json ]; then
            echo '{"matches":[]}' > grype-results.json
          fi

          THRESHOLD=${{ inputs.fail-threshold }}
          COUNT=$(jq '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' grype-results.json)

          echo "HIGH + CRITICAL findings: $COUNT"
          echo "Fail threshold: $THRESHOLD"

          if [ "$THRESHOLD" -gt 0 ] && [ "$COUNT" -ge "$THRESHOLD" ]; then
            echo "❌ SCA failed: $COUNT HIGH/CRITICAL vulnerabilities (>= $THRESHOLD)"
            exit 1
          fi

          echo "✅ SCA below threshold (or threshold disabled)"

      - name: Upload Grype JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-sca-results
          path: |
            grype-results.json
            results.sarif
          retention-days: 30
          if-no-files-found: ignore