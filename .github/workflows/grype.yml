name: Grype SCA

on:
  workflow_call:
    inputs:
      path:
        description: "Path to scan (directory)"
        required: false
        type: string
        default: "."
      severity-cutoff:
        description: "Minimum severity to report (negligible, low, medium, high, critical)"
        required: false
        type: string
        default: "high"
      fail-threshold:
        description: "Fail if HIGH+CRITICAL count >= this number (0 = never fail on count)"
        required: false
        type: number
        default: 5
      fail-build:
        description: "Fail the job on any finding at severity-cutoff (true/false)"
        required: false
        type: string
        default: "false"

  workflow_dispatch:

jobs:
  sca:
    name: Grype SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Grype SCA
        id: grype
        uses: anchore/scan-action@v4
        with:
          path: ${{ inputs.path }}
          fail-build: ${{ inputs.fail-build }}
          severity-cutoff: ${{ inputs.severity-cutoff }}
          output-format: sarif

      - name: Upload Grype SARIF to Code Scanning
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sca

      - name: Grype table report
        if: always()
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:${{ inputs.path }} -o table || true

      - name: Grype JSON + threshold check
        if: always()
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:${{ inputs.path }} -o json > grype-results.json || true

          THRESHOLD=${{ inputs.fail-threshold }}
          COUNT=$(jq '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' grype-results.json 2>/dev/null || echo 0)

          echo "HIGH + CRITICAL findings: $COUNT"
          echo "Fail threshold: $THRESHOLD"

          if [ "$THRESHOLD" -gt 0 ] && [ "$COUNT" -ge "$THRESHOLD" ]; then
            echo "❌ SCA failed: $COUNT HIGH/CRITICAL vulnerabilities (>= $THRESHOLD)"
            exit 1
          fi

          echo "✅ SCA below threshold (or threshold disabled)"

      - name: Upload Grype JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-sca-results
          path: grype-results.json
          retention-days: 30
          if-no-files-found: ignore