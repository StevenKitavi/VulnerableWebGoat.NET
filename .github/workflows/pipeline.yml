name: Main Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'          # Every Monday
  workflow_dispatch:

jobs:
  # =================================================
  # Stage 1: Build
  # =================================================
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  # =================================================
  # Stage 2: Test
  # =================================================
  test:
    name: "2. Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: |
          dotnet test --configuration Release --no-restore --verbosity normal || echo "No test projects found"

  # =================================================
  # Stage 3: CodeQL Security Analysis (reusable)
  # =================================================
  codeql:
    name: "3. CodeQL Analysis"
    needs: build
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  # =================================================
  # Stage 4: Docker Build & Push (reusable)
  # =================================================
  docker:
    name: "4. Docker Build & Push"
    needs: [build, test, codeql]
    uses: ./.github/workflows/dotnet.yml
    permissions:
      packages: write
      contents: read

  # =================================================
  # Stage 5: Deploy (only on master/main)
  # =================================================
  deploy:
    name: "5. Deploy"
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy finished
        run: |
          echo "Pipeline completed successfully"
          echo "Docker image has been built and pushed to GHCR"
          echo "CodeQL results are available in the Security tab"