name: Main Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # =================================================
  # Stage 1: Build
  # =================================================
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  # =================================================
  # Stage 2: Test
  # =================================================
  test:
    name: "2. Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: |
          dotnet test --configuration Release --no-restore --verbosity normal || echo "No tests found"

  # =================================================
  # Stage 3: CodeQL
  # =================================================
  codeql:
    name: "3. CodeQL Analysis"
    needs: build
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  # =================================================
  # Stage 4: Docker Build & Push
  # =================================================
  docker:
    name: "4. Docker Build"
    needs: [build, test, codeql]
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read
      packages: write

  # =================================================
  # Stage 5: Trivy Image Scan
  # =================================================
  trivy:
    name: "5. Trivy Image Scan"
    needs: docker
    uses: ./.github/workflows/trivy.yml
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      severity: "CRITICAL,HIGH"
      fail-threshold: 5
    permissions:
      contents: read
      security-events: write

  # =================================================
  # Stage 6: Cosign Sign (keyless)
  # =================================================
  cosign:
    name: "6. Cosign Sign"
    needs: docker
    uses: ./.github/workflows/cosign.yml
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # =================================================
  # Stage 7: Deploy (only on master/main)
  # =================================================
  deploy:
    name: "7. Deploy"
    runs-on: ubuntu-latest
    needs: [trivy, cosign]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy finished
        run: |
          echo "Pipeline completed successfully"
          echo "• CodeQL  → Security → Code scanning"
          echo "• Trivy   → Security → Code scanning"
          echo "• Image signed with Cosign (keyless)"