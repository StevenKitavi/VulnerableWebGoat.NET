name: Main Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # =================================================
  # Stage 1: Build
  # =================================================
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  # =================================================
  # Stage 2: Test
  # =================================================
  test:
    name: "2. Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: |
          dotnet test --configuration Release --no-restore --verbosity normal || echo "No tests found"

  # =================================================
  # Stage 3: CodeQL
  # =================================================
  codeql:
    name: "3. CodeQL Analysis"
    needs: build
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  # =================================================
  # Stage 4: Docker Build & Push
  # =================================================
  docker:
    name: "4. Docker Build"
    needs: [build, test, codeql]
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read
      packages: write

  # =================================================
  # Stage 5: Trivy Image Scan
  # =================================================
  trivy:
    name: "5. Trivy Image Scan"
    needs: docker
    uses: ./.github/workflows/trivy.yml
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      severity: "CRITICAL,HIGH"
      fail-threshold: 5
    permissions:
      contents: read
      security-events: write

  # =================================================
  # Stage 6: Cosign Sign (keyless)
  # =================================================
  cosign:
    name: "6. Cosign Sign"
    needs: docker
    uses: ./.github/workflows/cosign.yml
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # =================================================
  # Stage 7: SLSA Provenance Attestation (at build)
  # =================================================
  slsa:
    name: "7. SLSA Attestation"
    needs: docker
    uses: ./.github/workflows/slsa.yml
    with:
      image-name: ${{ needs.docker.outputs.image-name }}
      image-digest: ${{ needs.docker.outputs.image-digest }}
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

  # =================================================
  # Stage 8: Image Verification (Cosign + SLSA)
  # =================================================
  verify:
    name: "8. Image Verification"
    runs-on: ubuntu-24.04
    needs: [docker, cosign, slsa]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cosign signature
        run: |
          TARGET="${{ needs.docker.outputs.image-digest }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ needs.docker.outputs.image-ref }}"
          fi

          echo "Verifying Cosign signature for: $TARGET"

          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$TARGET"

          echo "✅ Cosign signature verified"

      - name: Verify SLSA / artifact attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REF="${{ needs.docker.outputs.image-ref }}"
          DIGEST_RAW="${{ needs.docker.outputs.image-digest }}"

          # Prefer OCI reference with digest for verification
          if [ -n "$DIGEST_RAW" ]; then
            if echo "$DIGEST_RAW" | grep -q '@'; then
              OCI_REF="oci://${DIGEST_RAW}"
            else
              NAME=$(echo "${{ needs.docker.outputs.image-name }}" | tr '[:upper:]' '[:lower:]')
              OCI_REF="oci://${NAME}@${DIGEST_RAW}"
            fi
          else
            OCI_REF="oci://${IMAGE_REF}"
          fi

          echo "Verifying SLSA attestation for: $OCI_REF"

          gh attestation verify "$OCI_REF" \
            --repo "${{ github.repository }}"

          echo "✅ SLSA / artifact attestation verified"

  # =================================================
  # Stage 9: Deploy (depends on verification)
  # =================================================
  deploy:
    name: "9. Deploy"
    runs-on: ubuntu-latest
    needs: [trivy, verify]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy finished
        run: |
          echo "Pipeline completed successfully"
          echo "• CodeQL     → Security → Code scanning"
          echo "• Trivy      → Security → Code scanning"
          echo "• Cosign     → signature verified"
          echo "• SLSA       → provenance attestation verified"
          echo "• Deploy allowed only after successful verification"