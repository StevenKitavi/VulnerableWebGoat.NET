name: Main Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # =================================================
  # Stage 1: Build
  # =================================================
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  # =================================================
  # Stage 2: Test
  # =================================================
  test:
    name: "2. Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore
      - run: dotnet test --configuration Release --no-restore --verbosity normal || echo "No tests found"

  # =================================================
  # Stage 3: CodeQL
  # =================================================
  codeql:
    name: "3. CodeQL Analysis"
    needs: build
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  # =================================================
  # Stage 4: Docker Build
  # =================================================
  docker:
    name: "4. Docker Build"
    needs: [build, test, codeql]
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read
      packages: write

  # =================================================
  # Stage 5: Trivy Scan (decoupled)
  # =================================================
  trivy:
    name: "5. Trivy Image Scan"
    needs: docker
    uses: ./.github/workflows/trivy.yml
    with:
      image-ref: ${{ needs.docker.outputs.image-ref }}
      severity: "CRITICAL,HIGH"
      exit-code: "1"
    permissions:
      contents: read
      security-events: write

  # =================================================
  # Stage 6: Deploy
  # =================================================
  deploy:
    name: "6. Deploy"
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy finished
        run: |
          echo "Pipeline completed successfully"
          echo "• CodeQL  → Security → Code scanning"
          echo "• Trivy   → Security → Code scanning"