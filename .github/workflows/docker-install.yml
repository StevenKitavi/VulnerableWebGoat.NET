name: Docker Install (Pure / Non-CIS)

on:
  workflow_dispatch:
    inputs:
      RUN_INSPEC:
        description: "Run InSpec CIS scan after install (true/false)"
        required: false
        default: "true"

  workflow_call:
    inputs:
      RUN_INSPEC:
        description: "Run InSpec CIS scan after install (true/false)"
        required: false
        type: string
        default: "true"
    secrets:
      DEPLOYMENT_SERVER:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      CHEF_LICENSE_KEY:
        required: false

jobs:
  install-docker:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_SERVER: ${{ secrets.DEPLOYMENT_SERVER }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RUN_INSPEC: ${{ inputs.RUN_INSPEC || github.event.inputs.RUN_INSPEC || 'true' }}
      CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general ansible.posix

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOYMENT_SERVER" >> ~/.ssh/known_hosts || true

      - name: Install pure Docker environment
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook Infrastructure/Ansible/install-docker-pure.yml \
            -i "${DEPLOYMENT_SERVER}," \
            -u "${DEPLOY_USER}" \
            --private-key ~/.ssh/deploy_key \
            -e "docker_users=['${DEPLOY_USER}']"

      - name: Install InSpec
        if: env.RUN_INSPEC == 'true'
        run: |
          curl -L https://omnitruck.chef.io/install.sh | sudo bash -s -- -P inspec

      - name: Run CIS Docker InSpec profile (post-install baseline)
        if: env.RUN_INSPEC == 'true'
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}
        run: |
          inspec exec https://github.com/StevenKitavi/compliance-as-code.git \
            -t ssh://${DEPLOY_USER}@${DEPLOYMENT_SERVER} \
            -i ~/.ssh/deploy_key \
            --reporter cli json:cis-docker-install-results.json \
            || true

      - name: Upload InSpec results
        if: env.RUN_INSPEC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cis-docker-install-results
          path: cis-docker-install-results.json
          if-no-files-found: ignore