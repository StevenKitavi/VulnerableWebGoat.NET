name: Docker Install (Pure / Non-CIS)

on:
  workflow_dispatch:
    inputs:
      RUN_INSPEC:
        description: "Run InSpec CIS scan after install (true/false)"
        required: false
        default: "true"

  workflow_call:
    inputs:
      RUN_INSPEC:
        description: "Run InSpec CIS scan after install (true/false)"
        required: false
        type: string
        default: "true"
    secrets:
      DEPLOYMENT_SERVER:
        description: "Server IP or hostname"
        required: true
      DEPLOY_USER:
        description: "SSH user"
        required: true
      DEPLOY_SSH_KEY:
        description: "Private SSH key (no passphrase)"
        required: true
      CHEF_LICENSE_KEY:
        description: "Chef license key for InSpec"
        required: false

jobs:
  install-docker:
    name: Docker Install + InSpec
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: deployment
    continue-on-error: true
    env:
      RUN_INSPEC: ${{ inputs.RUN_INSPEC || github.event.inputs.RUN_INSPEC || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets are present
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOYMENT_SERVER }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "❌ DEPLOYMENT_SERVER / DEPLOY_USER / DEPLOY_SSH_KEY is empty"
            echo "Add them under Settings → Environments → deployment"
            exit 1
          fi
          echo "✅ Deploy secrets present (key length ${#KEY})"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOYMENT_SERVER }}" >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible

      - name: Create inventory
        run: |
          cat > inventory.ini << EOF
          [prod]
          ${{ secrets.DEPLOYMENT_SERVER }} ansible_user=${{ secrets.DEPLOY_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=yes' ansible_python_interpreter=/usr/bin/python3
          EOF
          cat inventory.ini

      - name: Install pure Docker environment
        run: |
          ansible-playbook -i inventory.ini Infrastructure/Ansible/install-docker-pure.yml \
            -e "docker_users=['${{ secrets.DEPLOY_USER }}']"

      - name: Install InSpec
        if: env.RUN_INSPEC == 'true'
        env:
          CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}
        run: |
          curl -fsSL https://omnitruck.chef.io/install.sh | sudo bash -s -- -P inspec
          inspec version

      - name: Run CIS Docker InSpec profile (post-install baseline)
        if: env.RUN_INSPEC == 'true'
        env:
          CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}
        run: |
          inspec exec https://github.com/StevenKitavi/compliance-as-code.git \
            -t "ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOYMENT_SERVER }}" \
            --chef-license accept \
            --reporter html:cis-docker-install-results.html cli \
            || true

      - name: Upload InSpec report
        if: always() && env.RUN_INSPEC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inspec-cis-docker-install
          path: cis-docker-install-results.html
          retention-days: 30
          if-no-files-found: warn