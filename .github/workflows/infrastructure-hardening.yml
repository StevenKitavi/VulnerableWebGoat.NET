name: Infrastructure-Hardening

on:
  workflow_call:
    secrets:
      DEPLOYMENT_SERVER:
        description: "Server IP or hostname"
        required: true
      DEPLOY_USER:
        description: "SSH user"
        required: true
      DEPLOY_SSH_KEY:
        description: "Private SSH key (no passphrase)"
        required: true
      CHEF_LICENSE_KEY:
        description: "Chef license key for InSpec"
        required: false

  workflow_dispatch:

jobs:
  harden:
    name: Ansible + InSpec hardening
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: deployment
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets are present
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOYMENT_SERVER }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "❌ DEPLOYMENT_SERVER / DEPLOY_USER / DEPLOY_SSH_KEY is empty"
            echo "Add them under Settings → Environments → deployment"
            exit 1
          fi
          echo "✅ Deploy secrets present (key length ${#KEY})"

      # ---------- SSH (unencrypted deploy key) ----------
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOYMENT_SERVER }}" >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible

      - name: Create inventory
        run: |
          cat > inventory.ini << EOF
          [prod]
          ${{ secrets.DEPLOYMENT_SERVER }} ansible_user=${{ secrets.DEPLOY_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=yes' ansible_python_interpreter=/usr/bin/python3
          EOF
          cat inventory.ini

      # ---------- Fail2ban ----------
      - name: Run Fail2ban playbook
        run: |
          ansible-playbook -i inventory.ini Infrastructure/Ansible/fail2ban.yml


      # ---------- devsec.hardening requires the devsec playbook----------
      - name: Install devsec.hardening collection
        run: ansible-galaxy collection install devsec.hardening

      - name: Run OS hardening playbook
        run: |
          if [ -f .github/ansible/ansible-hardening.yml ]; then
            ansible-playbook -i inventory.ini Infrastructure/Ansible/ansible-hardening.yml
          else
            cat > /tmp/os-hardening.yml << 'PLAY'
          ---
          - name: Apply dev-sec OS hardening
            hosts: all
            become: true
            collections:
              - devsec.hardening
            roles:
              - role: devsec.hardening.os_hardening
          PLAY
          
            ansible-playbook -i inventory.ini /tmp/os-hardening.yml
          fi

      # ---------- Chef InSpec (linux-baseline) ----------
      - name: Install InSpec
        env:
          CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}
        run: |
          curl -fsSL https://omnitruck.chef.io/install.sh | sudo bash -s -- -P inspec
          inspec version

      - name: Run InSpec linux-baseline
        env:
          CHEF_LICENSE_KEY: ${{ secrets.CHEF_LICENSE_KEY }}
        run: |
          inspec exec https://github.com/dev-sec/linux-baseline \
            -t "ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOYMENT_SERVER }}" \
            --chef-license accept \
            --reporter html:linux-baseline.html cli \
            || true

      - name: Upload InSpec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspec-linux-baseline
          path: linux-baseline.html
          retention-days: 30
          if-no-files-found: warn