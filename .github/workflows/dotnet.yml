name: build .NET 8

on:
  workflow_call:
    outputs:
      image_tags:
        description: "Docker image tags that were built"
        value: ${{ jobs.build.outputs.tags }}
      image_name:
        description: "Main image name"
        value: ${{ jobs.build.outputs.image_name }}

  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build, Push & Scan
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write      # needed for Trivy SARIF upload

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      image_name: ${{ env.IMAGE_NAME }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=edge
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}   # load locally when not pushing (for PRs)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ============================================
      # Trivy Vulnerability Scan
      # ============================================
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'          # don't fail the pipeline (change to '1' if you want it to fail)
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Show Trivy table report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true