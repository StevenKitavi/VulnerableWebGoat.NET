name: build

on:
  workflow_call:
    outputs:
      image-ref:
        description: "Built image reference"
        value: ${{ jobs.build.outputs.image-ref }}
      image-digest:
        description: "Image digest after push"
        value: ${{ jobs.build.outputs.image-digest }}

  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.meta.outputs.image }}
      image-digest: ${{ steps.push.outputs.digest }}

    env:
      PUBLISH: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: meta
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${IMAGE_NAME}:${{ github.sha }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Building $IMAGE"

      - name: Build image
        run: docker build -t ${{ steps.meta.outputs.image }} .

      - name: Save Docker image (for Trivy)
        run: docker save ${{ steps.meta.outputs.image }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        if: env.PUBLISH == 'true'
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker tag ${{ steps.meta.outputs.image }} ${{ steps.meta.outputs.image_name }}:latest
          docker push ${{ steps.meta.outputs.image_name }}:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.image }})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Pushed: $DIGEST"