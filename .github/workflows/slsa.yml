name: SLSA Attestation

on:
  workflow_call:
    inputs:
      image-name:
        description: "Fully-qualified image name WITHOUT tag (e.g. ghcr.io/owner/repo)"
        required: true
        type: string
      image-digest:
        description: "Digest in form sha256:hex (or full repo@sha256:hex)"
        required: true
        type: string

jobs:
  attest:
    name: Generate SLSA Provenance
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
      - name: Normalize digest
        id: digest
        run: |
          RAW="${{ inputs.image-digest }}"
          # Accept either sha256:abc or ghcr.io/repo@sha256:abc
          if echo "$RAW" | grep -q '@'; then
            DIGEST="${RAW##*@}"
          else
            DIGEST="$RAW"
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Using digest: $DIGEST"
          echo "Using subject-name: ${{ inputs.image-name }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true