name: SLSA Attestation

on:
  workflow_call:
    inputs:
      image-name:
        description: "Fully-qualified image name WITHOUT tag (e.g. ghcr.io/owner/repo)"
        required: true
        type: string
      image-digest:
        description: "Digest (sha256:... or registry/repo@sha256:...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    name: Generate SLSA Provenance
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Validate and normalize inputs
        id: prep
        run: |
          NAME="${{ inputs.image-name }}"
          RAW="${{ inputs.image-digest }}"

          echo "Received image-name: '$NAME'"
          echo "Received image-digest: '$RAW'"

          if [ -z "$NAME" ]; then
            echo "❌ image-name is empty. Ensure dotnet.yml outputs image-name."
            exit 1
          fi

          if [ -z "$RAW" ]; then
            echo "❌ image-digest is empty. Image must be pushed first."
            exit 1
          fi

          # Normalize digest to sha256:hex
          if echo "$RAW" | grep -q '@'; then
            DIGEST="${RAW##*@}"
          else
            DIGEST="$RAW"
          fi

          # subject-name must NOT include a tag
          NAME="${NAME%%:*}"

          echo "subject-name=$NAME" >> $GITHUB_OUTPUT
          echo "subject-digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Using subject-name=$NAME"
          echo "Using subject-digest=$DIGEST"

      # Required so push-to-registry can write the attestation to GHCR
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.prep.outputs.subject-name }}
          subject-digest: ${{ steps.prep.outputs.subject-digest }}
          push-to-registry: true